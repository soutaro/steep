    type: location
  - name: rescue_expression
    type: node
    kind: Node
  comment: |
    Represents an expression modified with a rescue.

        foo rescue nil
        ^^^^^^^^^^^^^^
  steep_notes:
  - "`a rescue b`。parser では rescue ノードの一形態だった。"
- name: RescueNode
  prism: RescueNode
  steep: typed
  fields:
  - name: keyword_loc
    type: location
  - name: exceptions
    type: node[]
    kind: non-void expression
  - name: operator_loc
    type: location?
  - name: reference
    type: node?
    kind:
    - LocalVariableTargetNode
    - InstanceVariableTargetNode
    - ClassVariableTargetNode
    - GlobalVariableTargetNode
    - ConstantTargetNode
    - ConstantPathTargetNode
    - CallTargetNode
    - IndexTargetNode
  - name: then_keyword_loc
    type: location?
  - name: statements
    type: node
    kind: StatementsNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  - name: subsequent
    type: node?
    kind: RescueNode
  comment: |
    Represents a rescue statement.

        begin
        rescue Foo, *splat, Bar => ex
          foo
        ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
        end

    `Foo, *splat, Bar` are in the `exceptions` field. `ex` is in the `reference` field.
  steep_notes:
  - 複数の rescue 節は subsequent による連鎖(parser は配列だった)。reference は *TargetNode(LocalVariableTargetNode など)。
  - expression は最後の文で終わる(WhenNode と同じ)。statements.region は次の節のキーワードの直前まで。
- name: RestParameterNode
  prism: RestParameterNode
  steep: typed
  flags: ParameterFlags
  fields:
  - name: name
    type: constant?
  - name: name_loc
    type: location?
  - name: operator_loc
    type: location
  comment: |
    Represents a rest parameter to a method, block, or lambda definition.

        def a(*b)
              ^^
        end
- name: RetryNode
  prism: RetryNode
  steep: typed
  fields: []
  comment: |
    Represents the use of the `retry` keyword.

        retry
        ^^^^^
- name: ReturnNode
  prism: ReturnNode
  steep: typed
  fields:
  - name: keyword_loc
    type: location
  - name: arguments
    type: node?
    kind: ArgumentsNode
  comment: |
    Represents the use of the `return` keyword.

        return 1
        ^^^^^^^^
- name: SelfNode
  prism: SelfNode
  steep: typed
  fields: []
  comment: |
    Represents the `self` keyword.

        self
        ^^^^
- name: ShareableConstantNode
  prism: ShareableConstantNode
  steep: typed
  fields:
  - name: write
    type: node
    kind:
    - ConstantWriteNode
    - ConstantAndWriteNode
    - ConstantOrWriteNode
    - ConstantOperatorWriteNode
    - ConstantPathWriteNode
    - ConstantPathAndWriteNode
    - ConstantPathOrWriteNode
    - ConstantPathOperatorWriteNode
  comment: |
    This node wraps a constant write to indicate that when the value is written, it should have its shareability state modified.

        # shareable_constant_value: literal
        C = { a: 1 }
        ^^^^^^^^^^^^
  steep_notes:
  - "`# shareable_constant_value:` マジックコメント下の定数代入を包む。parser 変換は write をそのまま出していたので、TypeConstruction も write を素通しする。"
- name: SingletonClassNode
  prism: SingletonClassNode
  steep: typed
  fields:
  - name: class_keyword_loc
    type: location
  - name: operator_loc
    type: location
  - name: expression
    type: node
    kind: non-void expression
  - name: body
    type: node
    kind:
    - StatementsNode
    - BeginNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  - name: end_keyword_loc
    type: location
  comment: |
    Represents a singleton class declaration involving the `class` keyword.

        class << self end
        ^^^^^^^^^^^^^^^^^
  steep_notes:
  - parser の sclass。body は常に存在する。
- name: SourceEncodingNode
  prism: SourceEncodingNode
  steep: typed
  fields: []
  comment: |
    Represents the use of the `__ENCODING__` keyword.

        __ENCODING__
        ^^^^^^^^^^^^
  steep_notes:
  - "`__ENCODING__`。parser 変換では const Encoding::UTF_8 になり内側の const の location が nil になっていた癖が解消する。型は Encoding。"
- name: SourceFileNode
  prism: SourceFileNode
  steep: typed
  fields:
  - name: filepath
    type: string
  comment: |
    Represents the use of the `__FILE__` keyword.

        __FILE__
        ^^^^^^^^
  steep_notes:
  - "`__FILE__`。parser 変換では str だった。型は String。"
- name: SourceLineNode
  prism: SourceLineNode
  steep: typed
  fields: []
  comment: |
    Represents the use of the `__LINE__` keyword.

        __LINE__
        ^^^^^^^^
  steep_notes:
  - "`__LINE__`。parser 変換では int だった。型は Integer。"
- name: SplatNode
  prism: SplatNode
  steep: typed
  fields:
  - name: operator_loc
    type: location
  - name: expression
    type: node?
    kind: non-void expression
  comment: |
    Represents the use of the splat operator.

        [*a]
         ^^
  steep_notes:
  - 'expression が nil のときは匿名 `*`(`*, a = x`、`foo(*)`)。現状の forwarded_restarg は SplatNode(expression: nil)になる。'
- name: StatementsNode
  prism: StatementsNode
  steep: typed
  fields:
  - name: body
    type: node[]
    kind: Node
  - name: annotations
    type: annotation[]
    comment: この文の並びの region に書かれたブロックアノテーション(`@type var` など)。
  - name: region_loc
    type: location
    comment: この文の並びが書かれるテキスト上の領域(region)。`if foo` の then 節なら、条件の直後から `else` / `elsif` / `end` の直前まで。文の範囲(expression)とは一致しない。定義は regions セクション。
  comment: |
    Represents a set of statements contained within some scope.

        foo; bar; baz
        ^^^^^^^^^^^^^
  steep_notes:
  - Steep の AST では本体を表すすべての位置に常に存在し(空の本体は body が空)、ブロックアノテーションの唯一の付与先になる。
  - 位置を 2 つ持つ。location.expression は Prism と同じく最初の文から最後の文まで(空のときは region の開始位置の空範囲)。location.region は本体が書かれるテキスト上の領域で、空行やコメントを含む。
  - '例: `if foo\n  something()\nend` の then 節は、expression が `something()`、region が `foo` の直後から `end` の直前まで。'
  - 現状の mapping / construct_mapping は、コメントを含む最も内側の region の StatementsNode に付ける処理に置き換わる(annotation_attachment)。
- name: StringNode
  prism: StringNode
  steep: typed
  fields:
  - name: opening_loc
    type: location?
  - name: content_loc
    type: location
  - name: closing_loc
    type: location?
  - name: unescaped
    type: string
  - name: heredoc_body_loc
    type: location?
    comment: ヒアドキュメントの本文(開始記号の次の行から終端記号の直前まで)。ヒアドキュメントでなければ nil。expression は開始記号 `<<~EOS` だけを指すので、本文の中の位置はこれで判定する。
  comment: |
    Represents a string literal, a string contained within a `%w` list, or plain string content within an interpolated string.

        "foo"
        ^^^^^

        %w[foo]
           ^^^

        "foo #{bar} baz"
         ^^^^      ^^^^
  steep_notes:
  - ヒアドキュメントの expression は開始記号 `<<~EOS` だけ。本文は content_loc(= heredoc_body_loc)、終端記号は closing_loc。
- name: SuperNode
  prism: SuperNode
  steep: typed
  fields:
  - name: keyword_loc
    type: location
  - name: lparen_loc
    type: location?
  - name: arguments
    type: node?
    kind: ArgumentsNode
  - name: rparen_loc
    type: location?
  - name: block
    type: node?
    kind:
    - BlockNode
    - BlockArgumentNode
  comment: |
    Represents the use of the `super` keyword with parentheses or arguments.

        super()
        ^^^^^^^

        super foo, bar
        ^^^^^^^^^^^^^^

    If no arguments are provided (except for a block), it would be a `ForwardingSuperNode` instead.
- name: SymbolNode
  prism: SymbolNode
  steep: typed
  fields:
  - name: opening_loc
    type: location?
  - name: content_loc
    type: location
  - name: closing_loc
    type: location?
  - name: unescaped
    type: string
  comment: |
    Represents a symbol literal or a symbol contained within a `%i` list.

        :foo
        ^^^^

        %i[foo]
           ^^^
- name: TrueNode
  prism: TrueNode
  steep: typed
  fields: []
  comment: |
    Represents the use of the literal `true` keyword.

        true
        ^^^^
- name: UndefNode
  prism: UndefNode
  steep: unsupported
  fields:
  - name: names
    type: node[]
    kind:
    - SymbolNode
    - InterpolatedSymbolNode
  - name: keyword_loc
    type: location
  comment: |
    Represents the use of the `undef` keyword.

        undef :foo, :bar, :baz
        ^^^^^^^^^^^^^^^^^^^^^^
- name: UnlessNode
  prism: UnlessNode
  steep: typed
  fields:
  - name: unless_keyword_loc
    type: location
  - name: predicate
    type: node
    kind: non-void expression
  - name: then_keyword_loc
    type: location?
  - name: statements
    type: node
    kind: StatementsNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  - name: else_clause
    type: node?
    kind: ElseNode
  - name: end_keyword_loc
    type: location?
  comment: |
    Represents the use of the `unless` keyword, either in the block form or the modifier form.

        bar unless foo
        ^^^^^^^^^^^^^^

        unless foo then bar end
        ^^^^^^^^^^^^^^^^^^^^^^^
  steep_notes:
  - parser では `if` ノードだった。TypeConstruction の if の分岐を共有するか、UnlessNode 用の分岐を持つか(真偽の反転)。
- name: UntilNode
  prism: UntilNode
  steep: typed
  flags: LoopFlags
  fields:
  - name: until_keyword_loc
    type: location
  - name: do_keyword_loc
    type: location?
  - name: end_keyword_loc
    type: location?
  - name: predicate
    type: node
    kind: non-void expression
  - name: statements
    type: node
    kind: StatementsNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  comment: |
    Represents the use of the `until` keyword, either in the block form or the modifier form.

        bar until foo
        ^^^^^^^^^^^^^

        until foo do bar end
        ^^^^^^^^^^^^^^^^^^^^
  steep_notes:
  - WhileNode と同じ。
- name: WhenNode
  prism: WhenNode
  steep: typed
  fields:
  - name: when_keyword_loc
    type: location
  - name: conditions
    type: node[]
    kind: non-void expression
  - name: then_keyword_loc
    type: location?
  - name: statements
    type: node
    kind: StatementsNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  comment: |
    Represents the use of the `when` keyword within a case statement.

        case true
        when true
        ^^^^^^^^^
        end
  steep_notes:
  - expression は最後の文で終わり、その後ろの空行やコメントは含まない。statements.region は次の `when` / `else` / `end` の直前まで伸びるので、位置からノードを探すときは region も見る(regions セクションの locator)。
- name: WhileNode
  prism: WhileNode
  steep: typed
  flags: LoopFlags
  fields:
  - name: while_keyword_loc
    type: location
  - name: do_keyword_loc
    type: location?
  - name: end_keyword_loc
    type: location?
  - name: predicate
    type: node
    kind: non-void expression
  - name: statements
    type: node
    kind: StatementsNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  comment: |
    Represents the use of the `while` keyword, either in the block form or the modifier form.

        bar while foo
        ^^^^^^^^^^^^^

        while foo do bar end
        ^^^^^^^^^^^^^^^^^^^^
  steep_notes:
  - parser の while / while_post。`begin ... end while` は LoopFlags::BEGIN_MODIFIER。修飾子形式 `b while a` はフラグなしで end_keyword_loc が nil。
- name: XStringNode
  prism: XStringNode
  steep: typed
  fields:
  - name: opening_loc
    type: location
  - name: content_loc
    type: location
  - name: closing_loc
    type: location
  - name: unescaped
    type: string
  - name: heredoc_body_loc
    type: location?
    comment: ヒアドキュメントの本文(開始記号の次の行から終端記号の直前まで)。ヒアドキュメントでなければ nil。expression は開始記号 `<<~EOS` だけを指すので、本文の中の位置はこれで判定する。
  comment: |
    Represents an xstring literal with no interpolation.

        `foo`
        ^^^^^
- name: YieldNode
  prism: YieldNode
  steep: typed
  fields:
  - name: keyword_loc
    type: location
  - name: lparen_loc
    type: location?
  - name: arguments
    type: node?
    kind: ArgumentsNode
  - name: rparen_loc
    type: location?
  comment: |
    Represents the use of the `yield` keyword.

        yield 1
        ^^^^^^^
- name: TypeAssertionNode
  prism:
  steep: steep_only
  fields:
  - name: expression
    type: node
    kind: non-void expression
  - name: assertion
    type: TypeAssertion
  comment: |
    Represents a type assertion comment attached to an expression.
        foo #: Integer
        ^^^^^^^^^^^^^^
  steep_notes:
  - "`expr #: Type`。現状の `(assertion expr <TypeAssertion>)` の置き換え。expression の範囲は式の先頭からコメント末尾まで。"
  - '付与規則は Source.insert_type_node のものを移植する: 代入(*WriteNode)は value に付ける、return / break / next、def、KeywordHashNode、WhenNode、AssocNode のキーには付けない、MultiWriteNode は value、ParenthesesNode は全体、attr_* の呼び出しは付けない(inline RBS が扱う)、Data.define / Struct.new の引数には付けない。'
- name: TypeApplicationNode
  prism:
  steep: steep_only
  fields:
  - name: call
    type: node
    kind: CallNode
  - name: application
    type: TypeApplication
  comment: |
    Represents a type application comment attached to a method call.
        foo.bar(1) #$ Integer
        ^^^^^^^^^^^^^^^^^^^^^
  steep_notes:
  - "`call #$ Type, Type`。現状の `(tapp sendish <TypeApplication>)` の置き換え。TypeApplication#set_node の逆参照は不要になる。"
  - expression は call の範囲。コメントが call の末尾より後ろにあるときはコメント末尾まで伸ばす。
