regions:
  description: StatementsNode の location.region の定義。開始は「直前のトークンの終わり」、終了は「直後のトークンの始まり」で、文字単位の範囲。空行とコメントを含む。
  definitions:
  - node: ProgramNode.statements
    start: ファイルの先頭
    end: ファイルの終わり
  - node: DefNode.body
    start: rparen_loc、なければ parameters、なければ name_loc の終わり(endless def は equal_loc の終わり)
    end: end_keyword_loc の始まり(endless def は本体の終わり)
  - node: ClassNode.body
    start: superclass、なければ constant_path の終わり
    end: end_keyword_loc の始まり
  - node: ModuleNode.body
    start: constant_path の終わり
    end: end_keyword_loc の始まり
  - node: SingletonClassNode.body
    start: expression の終わり
    end: end_keyword_loc の始まり
  - node: BlockNode.body
    start: BlockParametersNode があればその終わり(`|` を含む)、なければ opening_loc の終わり
    end: closing_loc の始まり
  - node: LambdaNode.body
    start: opening_loc の終わり
    end: closing_loc の始まり
  - node: "(上の body が暗黙の BeginNode のとき)BeginNode.statements"
    start: 上と同じ
    end: 最初の節(rescue_clause / else_clause / ensure_clause)のキーワードの始まり
  - node: BeginNode.statements(`begin` あり)
    start: begin_keyword_loc の終わり
    end: 最初の節のキーワード、なければ end_keyword_loc の始まり
  - node: RescueNode.statements
    start: then_keyword_loc、なければ reference、なければ最後の exceptions、なければ keyword_loc の終わり
    end: 次の節(subsequent の rescue / else / ensure)のキーワード、なければ親の end_keyword_loc の始まり
  - node: ElseNode.statements
    start: else_keyword_loc の終わり
    end: end_keyword_loc(`end` / `ensure`)の始まり。三項演算子では ElseNode の終わり
  - node: EnsureNode.statements
    start: ensure_keyword_loc の終わり
    end: end_keyword_loc の始まり
  - node: IfNode / UnlessNode.statements
    start: then_keyword_loc(三項演算子では `?`)、なければ predicate の終わり。修飾子形式はノードの始まり
    end: subsequent / else_clause のキーワード、なければ end_keyword_loc の始まり。修飾子形式は if_keyword_loc の始まり
  - node: WhileNode / UntilNode.statements
    start: do_keyword_loc、なければ predicate の終わり。修飾子形式と BEGIN_MODIFIER はノードの始まり
    end: end_keyword_loc の始まり。修飾子形式と BEGIN_MODIFIER は keyword の始まり
  - node: ForNode.statements
    start: do_keyword_loc、なければ collection の終わり
    end: end_keyword_loc の始まり
  - node: WhenNode / InNode.statements
    start: then_keyword_loc、なければ最後の条件(InNode は pattern)の終わり
    end: 次の WhenNode / InNode、else_clause、end_keyword_loc のうち最初のものの始まり
  - node: ParenthesesNode / EmbeddedStatementsNode / PreExecutionNode / PostExecutionNode の StatementsNode
    start: opening_loc の終わり
    end: closing_loc の始まり
  locator:
  - 位置からノードを探す処理(Locator、Source#find_nodes)は、子の expression に加えて StatementsNode の region も見る。空行やコメントの上のカーソルでも、どの本体(then 節か else 節か、など)にいるかが分かる。
  - WhenNode / InNode / RescueNode は expression が最後の文で終わるので、その後ろの空行は親の中で子の expression に入らない。これらの節は statements.region に入っていれば降りる。
  - ヒアドキュメントの本文の中の位置は、文字列ノードの heredoc_body_loc で判定する(expression は開始記号だけのため)。
annotation_attachment:
  rule: アノテーションのコメントの開始位置を含む region のうち、最も内側のものの StatementsNode.annotations に付ける。
  header_rule: DefNode / ClassNode / ModuleNode / SingletonClassNode / BlockNode / LambdaNode のヘッダ(キーワードから本体の region の開始まで)にあるコメントは、その本体の StatementsNode に付ける。現状 def のパラメータリストの中に書いたアノテーションは def に付いているため。
  notes:
  - 三項演算子と修飾子形式の本体は、region が文そのものなので、実際にアノテーションが付くことはない。
  - TypeConstruction は StatementsNode に入るときに annotations を適用する。def / class / block では、そのコンテキスト(メソッドの戻り値型、self の型など)を作るときに使う。
  behavior_changes:
    description: 現状の行単位の規則(Source#construct_mapping)との違い。Steep 2.1.0 の Source.parse で確認した。いずれも、現状では本来の本体から漏れて外側に付いている。
    cases:
    - code: |-
        case x
        when 1 # @type var a: Integer
          a
        end
      now: トップレベル
      new: when 節の本体
    - code: |-
        case x
        when 1
          b
          a # @type var a: Integer
        end
      now: トップレベル(本体の最終行が範囲に入らない)
      new: when 節の本体
    - code: |-
        case x
        when 1
          b
          # @type var a: Integer
        when 2
        end
      now: トップレベル
      new: when 1 の本体
    - code: |-
        if x
          # @type var a: Integer
        end
      now: トップレベル(then 節が空だと付与先が無い)
      new: then 節の本体
    - code: |-
        for x in y
          # @type var a: Integer
          a
        end
      now: トップレベル(for は付与対象外)
      new: for の本体
    - code: |-
        begin
          a
        rescue
          b
          # @type var a: Integer
        ensure
          c
        end
      now: begin 全体(parser の ensure ノード)
      new: rescue 節の本体
    - code: |-
        def foo(a, # @type var a: Integer
                b)
        end
      now: def
      new: def の本体(header_rule により同じ)
parser_mapping:
- parser: send / csend / block / numblock / itblock
  prism: 'CallNode(block: BlockNode | BlockArgumentNode、`&.` は CallNodeFlags::SAFE_NAVIGATION)。ブロックの引数は BlockNode.parameters(BlockParametersNode | NumberedParametersNode | ItParametersNode)'
- parser: lambda(block の呼び出し側)
  prism: LambdaNode
- parser: lvasgn / ivasgn / gvasgn / cvasgn / casgn(value あり)
  prism: LocalVariableWriteNode / InstanceVariableWriteNode / GlobalVariableWriteNode / ClassVariableWriteNode / ConstantWriteNode / ConstantPathWriteNode
- parser: '同(value なし: mlhs / for / resbody の対象)'
  prism: LocalVariableTargetNode / InstanceVariableTargetNode / GlobalVariableTargetNode / ClassVariableTargetNode / ConstantTargetNode / ConstantPathTargetNode / CallTargetNode / IndexTargetNode
- parser: op_asgn / or_asgn / and_asgn
  prism: 対象の種類ごとの *OperatorWriteNode / *OrWriteNode / *AndWriteNode(LocalVariable / InstanceVariable / GlobalVariable / ClassVariable / Constant / ConstantPath / Call / Index)
- parser: masgn / mlhs
  prism: MultiWriteNode / MultiTargetNode(lefts / rest / rights)
- parser: splat(mlhs 内の匿名 `*`)
  prism: 'SplatNode(expression: nil)。末尾カンマ `a, = x` は ImplicitRestNode'
- parser: begin(括弧なしの文の並び)
  prism: StatementsNode
- parser: begin(括弧あり)
  prism: ParenthesesNode
- parser: begin(式展開 ``)
  prism: EmbeddedStatementsNode(`` は EmbeddedVariableNode)
- parser: kwbegin / rescue / resbody / ensure
  prism: 'BeginNode(rescue_clause: RescueNode が subsequent で連鎖、else_clause: ElseNode、ensure_clause: EnsureNode)。def / class / block の本体の rescue も BeginNode'
- parser: rescue(修飾子 `a rescue b`)
  prism: RescueModifierNode
- parser: if(`unless` キーワード)
  prism: UnlessNode
- parser: if(三項演算子)
  prism: 'IfNode(if_keyword_loc: nil、then_keyword_loc: `?`、subsequent: ElseNode(else_keyword_loc: `:`))'
- parser: if(`elsif`)
  prism: IfNode.subsequent に入れ子の IfNode
- parser: while_post / until_post
  prism: WhileNode / UntilNode + LoopFlags::BEGIN_MODIFIER
- parser: case / when
  prism: CaseNode / WhenNode / ElseNode
- parser: irange / erange
  prism: RangeNode(+ RangeFlags::EXCLUDE_END)
- parser: iflipflop / eflipflop
  prism: FlipFlopNode
- parser: match_current_line
  prism: MatchLastLineNode / InterpolatedMatchLastLineNode
- parser: args / arg / optarg / restarg / kwarg / kwoptarg / kwrestarg / kwnilarg / blockarg / shadowarg / forward_arg
  prism: 'ParametersNode(requireds / optionals / rest / posts / keywords / keyword_rest / block)+ RequiredParameterNode / OptionalParameterNode / RestParameterNode / RequiredKeywordParameterNode / OptionalKeywordParameterNode / KeywordRestParameterNode / NoKeywordsParameterNode / BlockParameterNode / ForwardingParameterNode。ブロックは BlockParametersNode(parameters、locals: BlockLocalVariableNode)'
- parser: procarg0
  prism: 対応ノード無し。BlockParametersNode の requireds が 1 つだけで他が空のときに自動 splat と判定する。`|(a, b)|` は MultiTargetNode
- parser: kwargs / pair / kwsplat / block_pass / forwarded_args / forwarded_restarg / forwarded_kwrestarg
  prism: 'ArgumentsNode の中の KeywordHashNode / AssocNode / AssocSplatNode / BlockArgumentNode(CallNode.block)/ ForwardingArgumentsNode / SplatNode(expression: nil)/ AssocSplatNode(value: nil)'
- parser: zsuper / super / yield
  prism: ForwardingSuperNode / SuperNode / YieldNode
- parser: defined?
  prism: DefinedNode
- parser: str / dstr / xstr / sym / dsym / regexp / regopt
  prism: StringNode / InterpolatedStringNode / XStringNode / InterpolatedXStringNode / SymbolNode / InterpolatedSymbolNode / RegularExpressionNode / InterpolatedRegularExpressionNode(regopt は RegularExpressionFlags)
- parser: const / cbase
  prism: ConstantReadNode / ConstantPathNode(parent が nil で `::Foo`)
- parser: nth_ref / back_ref
  prism: NumberedReferenceReadNode / BackReferenceReadNode
- parser: match_with_lvasgn
  prism: 'MatchWriteNode(call: CallNode、targets: LocalVariableTargetNode の配列)'
- parser: alias / undef
  prism: AliasMethodNode / AliasGlobalVariableNode / UndefNode
- parser: preexe / postexe
  prism: PreExecutionNode / PostExecutionNode
- parser: __ENCODING__ / __FILE__ / __LINE__(const / str / int に変換されていた)
  prism: SourceEncodingNode / SourceFileNode / SourceLineNode
- parser: int / float / rational / complex
  prism: IntegerNode / FloatNode / RationalNode(numerator、denominator)/ ImaginaryNode(numeric)
- parser: case_match / in_pattern / match_var / match_alt / match_as / match_rest / match_nil_pattern / pin / array_pattern / array_pattern_with_tail / find_pattern / hash_pattern / const_pattern / match_pattern / match_pattern_p / if_guard / unless_guard
  prism: 'CaseMatchNode / InNode / LocalVariableTargetNode / AlternationPatternNode / CapturePatternNode / SplatNode / NoKeywordsParameterNode / PinnedVariableNode / PinnedExpressionNode / ArrayPatternNode(constant: で定数つき)/ FindPatternNode / HashPatternNode(constant: で定数つき)/ MatchRequiredNode / MatchPredicateNode / ガードは InNode.pattern を包む IfNode / UnlessNode'
- parser: assertion / tapp(Steep が合成していたノード)
  prism: TypeAssertionNode / TypeApplicationNode
open_questions:
- 名前空間とクラス名(`Steep::AST::Node::IfNode` か `Steep::AST::Ruby::IfNode` か。Prism と同名にして名前空間で区別する案)。
- 'フロントエンド: Prism.parse の結果から直接構築する(推奨。Prism::Compiler のサブクラスで 1 パス)か、当面は parser gem 変換の木から構築するか。前者なら parser gem への依存は型検査から外れ、コメントも Prism::Comment になる。'
- "`unescaped` などフィールド名を Prism のまま使うか、Steep 向きに `value` へ改名するか(ここでは Prism のまま)。"
- WhenNode / InNode / RescueNode の expression を、本体の region の終わりまで伸ばすか(伸ばすと位置の探索が単純になるが、Prism の範囲と変わる。ここでは伸ばさず、探索側で region を見る)。
- ErrorRecoveryNode を落として良いか(LSP で error tolerant にするなら必要)。
- アノテーションの型を RBS::Types::t(未解決)で持つか、現状どおり Steep の AST::Types::t で持つか。
- "`==` / `hash`(TypeEnv の pure node キー)に annotations と location を含めない方針で良いか。"
- 互換プロトコル(parser 風の `type` / `children`)は、木の形が parser と違うので提供しない。TypeConstruction と テストは新 AST に合わせて書き直す前提で良いか。
