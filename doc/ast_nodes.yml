  # Steep AST ノード仕様(ドラフト)
  #
  # このファイルは doc/generate_ast_nodes.rb が生成する。手で編集せず、スクリプト側の差分定義を変更して再生成する。
  #
  #   $ ruby doc/generate_ast_nodes.rb > doc/ast_nodes.yml
  #
  # 方針:
  #   - Steep の AST は Prism のノード構造に従う。nodes の各要素は Prism 2.1.0 の config.yml の定義を写し、
  #     Steep 向きの差分を適用したもの。フィールドの説明と例は Prism の config.yml を参照する。
  #   - 各ノードは Steep 自身のクラス(Prism のクラスではない)として生成する。`type: location` / `location?` のフィールドは
  #     `<Name>::Location` クラスに束ねられ(フィールド名は `_loc` を外したもの)、`expression`(ノード全体の範囲)が加わる。
  #     各位置は flat な RBS::Location(RBS::Location[bot, bot])。
  #   - 範囲は 2 種類ある。location.expression はノードの範囲で、Prism の範囲をそのまま使う(暗黙の BeginNode だけ調整する)。
#     StatementsNode の location.region と、文字列の heredoc_body は、テキストとして意味のある範囲(本体の領域、ヒアドキュメントの本文)で、
#     expression とは一致しない。アノテーションの付与と、位置からノードを探す処理は region を使う(regions セクション)。
#   - ブロックアノテーションは木の一部にする。本体を表す StatementsNode は空でも常に存在し、`annotations` フィールドを持つ。
  #     型アサーション `#: T` と型適用 `#$ T` は TypeAssertionNode / TypeApplicationNode として木に入る。
  #   - flags は述語メソッド(`safe_navigation?` など)だけを公開し、内部は Integer のビット集合で持つ。Prism の flags のうち、
#     構文の区別(category: syntax)と構文から導ける要約(category: derived)だけを残し、コンパイラ向けのものは落とす。
#   - `==` / `hash` は fields と flags から構造的に計算し、location と annotations は含めない(TypeEnv の pure node キーのため)。
#     flags を含めるのは、`a.b` と `a&.b` のようにフラグだけが違うノードを区別するため。
  #   - 木は Prism.parse の結果から Prism::Compiler のサブクラスで構築する想定(open_questions 参照)。
  #
  # 各ノードのキー:
  #   name / prism:  Steep のクラス名と、対応する Prism のノード名(Steep 独自ノードは prism が null)
  #   steep:         typed = 現状の TypeConstruction で対応する構文を型検査している
  #                  unsupported = 現状 UnsupportedSyntax になる構文
  #                  steep_only = Steep が導入するノード
  #   flags:         Prism の flags 名(flags セクション)。残す値が無いフラグ群(文字列のエンコーディングなど)は付かない
  #   fields:        name / type / kind(Prism と同じ語彙。type_mapping に Ruby 型との対応)。steep キーは Steep での変更点
  #   comment:       Prism の説明(英語)。`^^^` は例の中でそのノードが表す範囲
  #   steep_notes:   Steep 向きの補足(日本語)

version: draft-2
prism_version: 2.1.0
type_mapping:
  node: Node(抽象基底。kind があればそのクラス)
  node?: Node?
  node[]: Array[Node]
  constant: Symbol
  constant?: Symbol?
  constant[]: Array[Symbol]
  string: String
  integer: Integer
  double: Float
  uint8: Integer
  uint32: Integer
  location: RBS::Location(flat。<Name>::Location のフィールドになる)
  location?: RBS::Location?(同上)
  annotation[]: Array[annotation](Steep 独自。annotations セクションのクラスの和)
  TypeAssertion: Steep::AST::TypeAssertion(Steep 独自。annotations セクション)
  TypeApplication: Steep::AST::TypeApplication(Steep 独自。annotations セクション)
dropped_nodes:
  ErrorRecoveryNode: Steep は構文エラーのあるファイルを型検査しない(all_errors_are_fatal)。LSP で error tolerant にする場合に再検討。
dropped_fields:
  locals: all nodes
  depth: all nodes
flags:
- name: ArgumentsNodeFlags
  values:
  - name: CONTAINS_FORWARDING
    category: derived
    comment: if the arguments contain forwarding
  - name: CONTAINS_KEYWORDS
    category: derived
    comment: if the arguments contain keywords
  - name: CONTAINS_KEYWORD_SPLAT
    category: derived
    comment: if the arguments contain a keyword splat
  - name: CONTAINS_SPLAT
    category: derived
    comment: if the arguments contain a splat
  - name: CONTAINS_MULTIPLE_SPLATS
    category: derived
    comment: if the arguments contain multiple splats
- name: ArrayNodeFlags
  values:
  - name: CONTAINS_SPLAT
    category: derived
    comment: if array contains splat nodes
- name: CallNodeFlags
  values:
  - name: SAFE_NAVIGATION
    category: syntax
    comment: "&. operator"
    steep_note: parser の csend。
  - name: VARIABLE_CALL
    category: derived
    comment: a call that could have been a local variable
    steep_note: レシーバも引数も括弧も無い `foo`。ローカル変数だったかもしれない呼び出しで、補完やホバーで使える。
  - name: ATTRIBUTE_WRITE
    category: syntax
    comment: a call that is an attribute write, so the value being written should be returned
    steep_note: "`a.b = 1` / `a[1] = 2`。式の値はメソッドの戻り値ではなく右辺。"
  - name: IGNORE_VISIBILITY
    category: derived
    comment: a call that ignores method visibility
    steep_note: レシーバが無いか `self` の呼び出し。NodeHelper#private_send? を置き換える。
- name: KeywordHashNodeFlags
  values:
  - name: SYMBOL_KEYS
    category: derived
    comment: a keyword hash which only has `AssocNode` elements all with symbol keys, which means the elements can be treated as keyword arguments
- name: LoopFlags
  values:
  - name: BEGIN_MODIFIER
    category: syntax
    comment: a loop after a begin statement, so the body is executed first before the condition
    steep_note: parser の while_post / until_post(`begin ... end while cond`)。
- name: ParameterFlags
  values:
  - name: REPEATED_PARAMETER
    category: derived
    comment: a parameter name that has been repeated in the method signature
    steep_note: "`_` のように同じ名前が繰り返されたパラメータ。"
- name: ParenthesesNodeFlags
  values:
  - name: MULTIPLE_STATEMENTS
    category: derived
    comment: parentheses that contain multiple potentially void statements
- name: RangeFlags
  values:
  - name: EXCLUDE_END
    category: syntax
    comment: "... operator"
    steep_note: parser の erange / eflipflop。
- name: RegularExpressionFlags
  values:
  - name: IGNORE_CASE
    category: syntax
    comment: i - ignores the case of characters when matching
    steep_note: parser の regopt の子(`:i`)。他の正規表現オプション(x m o e n s u)も同様。
  - name: EXTENDED
    category: syntax
    comment: x - ignores whitespace and allows comments in regular expressions
  - name: MULTI_LINE
    category: syntax
    comment: m - allows $ to match the end of lines within strings
  - name: ONCE
    category: syntax
    comment: o - only interpolates values into the regular expression once
  - name: EUC_JP
    category: syntax
    comment: e - forces the EUC-JP encoding
  - name: ASCII_8BIT
    category: syntax
    comment: n - forces the ASCII-8BIT encoding
  - name: WINDOWS_31J
    category: syntax
    comment: s - forces the Windows-31J encoding
  - name: UTF_8
    category: syntax
    comment: u - forces the UTF-8 encoding
dropped_flags:
  reason: コンパイラ向けの情報(エンコーディングの強制、frozen_string_literal、整数リテラルの基数、shareable_constant_value のモード)で、型検査には使わない。必要になった時点で KEPT_FLAGS に足す。
  values:
  - EncodingFlags::FORCED_UTF8_ENCODING
  - EncodingFlags::FORCED_BINARY_ENCODING
  - IntegerBaseFlags::BINARY
  - IntegerBaseFlags::DECIMAL
  - IntegerBaseFlags::OCTAL
  - IntegerBaseFlags::HEXADECIMAL
  - InterpolatedStringNodeFlags::FROZEN
  - InterpolatedStringNodeFlags::MUTABLE
  - RegularExpressionFlags::FORCED_UTF8_ENCODING
  - RegularExpressionFlags::FORCED_BINARY_ENCODING
  - RegularExpressionFlags::FORCED_US_ASCII_ENCODING
  - ShareableConstantNodeFlags::LITERAL
  - ShareableConstantNodeFlags::EXPERIMENTAL_EVERYTHING
  - ShareableConstantNodeFlags::EXPERIMENTAL_COPY
  - StringFlags::FORCED_UTF8_ENCODING
  - StringFlags::FORCED_BINARY_ENCODING
  - StringFlags::FROZEN
  - StringFlags::MUTABLE
  - SymbolFlags::FORCED_UTF8_ENCODING
  - SymbolFlags::FORCED_BINARY_ENCODING
  - SymbolFlags::FORCED_US_ASCII_ENCODING
nodes:
- name: AliasGlobalVariableNode
  prism: AliasGlobalVariableNode
  steep: typed
  fields:
  - name: new_name
    type: node
    kind:
    - GlobalVariableReadNode
    - BackReferenceReadNode
    - NumberedReferenceReadNode
  - name: old_name
    type: node
    kind:
    - GlobalVariableReadNode
    - BackReferenceReadNode
    - NumberedReferenceReadNode
  - name: keyword_loc
    type: location
  comment: |
    Represents the use of the `alias` keyword to alias a global variable.

        alias $foo $bar
        ^^^^^^^^^^^^^^^
- name: AliasMethodNode
  prism: AliasMethodNode
  steep: typed
  fields:
  - name: new_name
    type: node
    kind:
    - SymbolNode
    - InterpolatedSymbolNode
  - name: old_name
    type: node
    kind:
    - SymbolNode
    - InterpolatedSymbolNode
  - name: keyword_loc
    type: location
  comment: |
    Represents the use of the `alias` keyword to alias a method.

        alias foo bar
        ^^^^^^^^^^^^^
- name: AlternationPatternNode
  prism: AlternationPatternNode
  steep: unsupported
  fields:
  - name: left
    type: node
    kind: pattern expression
  - name: right
    type: node
    kind: pattern expression
  - name: operator_loc
    type: location
  comment: |
    Represents an alternation pattern in pattern matching.

        foo => bar | baz
               ^^^^^^^^^
- name: AndNode
  prism: AndNode
  steep: typed
  fields:
  - name: left
    type: node
    kind: non-void expression
  - name: right
    type: node
    kind: Node
  - name: operator_loc
    type: location
  comment: |
    Represents the use of the `&&` operator or the `and` keyword.

        left and right
        ^^^^^^^^^^^^^^
- name: ArgumentsNode
  prism: ArgumentsNode
  steep: typed
  flags: ArgumentsNodeFlags
  fields:
  - name: arguments
    type: node[]
    kind: non-void expression
  comment: |
    Represents a set of arguments to a method or a keyword.

        return foo, bar, baz
               ^^^^^^^^^^^^^
- name: ArrayNode
  prism: ArrayNode
  steep: typed
  flags: ArrayNodeFlags
  fields:
  - name: elements
    type: node[]
    kind: non-void expression
  - name: opening_loc
    type: location?
  - name: closing_loc
    type: location?
  comment: |
    Represents an array literal. This can be a regular array using brackets or a special array using % like %w or %i.

        [1, 2, 3]
        ^^^^^^^^^
- name: ArrayPatternNode
  prism: ArrayPatternNode
  steep: unsupported
  fields:
  - name: constant
    type: node?
    kind:
    - ConstantPathNode
    - ConstantReadNode
  - name: requireds
    type: node[]
    kind: pattern expression
  - name: rest
    type: node?
    kind:
    - ImplicitRestNode
    - SplatNode
  - name: posts
    type: node[]
    kind: pattern expression
  - name: opening_loc
    type: location?
  - name: closing_loc
    type: location?
  comment: |
    Represents an array pattern in pattern matching.

        foo in 1, 2
               ^^^^

        foo in [1, 2]
               ^^^^^^

        foo in *bar
               ^^^^

        foo in Bar[]
               ^^^^^

        foo in Bar[1, 2, 3]
               ^^^^^^^^^^^^
  steep_notes:
  - 同上。parser の array_pattern / array_pattern_with_tail / const_pattern(配列)に対応。
- name: AssocNode
  prism: AssocNode
  steep: typed
  fields:
  - name: key
    type: node
    kind: non-void expression
  - name: value
    type: node
    kind: non-void expression
  - name: operator_loc
    type: location?
  comment: |
    Represents a hash key/value pair.

        { a => b }
          ^^^^^^
- name: AssocSplatNode
  prism: AssocSplatNode
  steep: typed
  fields:
  - name: value
    type: node?
    kind: non-void expression
  - name: operator_loc
    type: location
  comment: |
    Represents a splat in a hash literal.

        { **foo }
          ^^^^^
  steep_notes:
  - value が nil のときは匿名 `**`(`foo(**)`)。現状の forwarded_kwrestarg はこれになる。
- name: BackReferenceReadNode
  prism: BackReferenceReadNode
  steep: typed
  fields:
  - name: name
    type: constant
  comment: |
    Represents reading a reference to a field in the previous match.

        $'
        ^^
- name: BeginNode
  prism: BeginNode
  steep: typed
  fields:
  - name: begin_keyword_loc
    type: location?
  - name: statements
    type: node
    kind: StatementsNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  - name: rescue_clause
    type: node?
    kind: RescueNode
  - name: else_clause
    type: node?
    kind: ElseNode
  - name: ensure_clause
    type: node?
    kind: EnsureNode
  - name: end_keyword_loc
    type: location?
  comment: |
    Represents a begin statement.

        begin
          foo
        end
        ^^^^^
  steep_notes:
  - parser の kwbegin / rescue / resbody / ensure の入れ子を、rescue_clause / else_clause / ensure_clause のフィールドで平坦に表す。def / class / module / block の本体に rescue や ensure があるときも BeginNode(begin_keyword_loc は nil)。
  - 暗黙の BeginNode(begin_keyword_loc が nil)の expression は、Prism では親と同じで `def` / `class` / `do` から始まり、ヘッダ(名前やパラメータ)まで含んでしまう。Steep の変換では、親の本体の region の開始位置から親の終わりまでにする。
- name: BlockArgumentNode
  prism: BlockArgumentNode
  steep: typed
  fields:
  - name: expression
    type: node?
    kind: non-void expression
  - name: operator_loc
    type: location
  comment: |
    Represents a block argument using `&`.

        bar(&args)
            ^^^^^
  steep_notes:
  - expression が nil のときは匿名 `&`。parser の block_pass。CallNode.block に入る。
- name: BlockLocalVariableNode
  prism: BlockLocalVariableNode
  steep: unsupported
  flags: ParameterFlags
  fields:
  - name: name
    type: constant
  comment: |
    Represents a block local variable.

        a { |; b| }
               ^
- name: BlockNode
  prism: BlockNode
  steep: typed
  fields:
  - name: parameters
    type: node?
    kind:
    - BlockParametersNode
    - NumberedParametersNode
    - ItParametersNode
  - name: body
    type: node
    kind:
    - StatementsNode
    - BeginNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  - name: opening_loc
    type: location
  - name: closing_loc
    type: location
  comment: |
    Represents a block of ruby code.

        [1, 2, 3].each { |i| puts x }
                       ^^^^^^^^^^^^^^
  steep_notes:
  - parameters は BlockParametersNode | NumberedParametersNode | ItParametersNode | nil。numblock / itblock のノード種は無くなる。
  - body は StatementsNode か、rescue / ensure を含むときは BeginNode。常に存在する(空でも StatementsNode)。ブロックのアノテーション(`@type block` など)は body(または body.statements)の annotations に入る。
- name: BlockParameterNode
  prism: BlockParameterNode
  steep: typed
  flags: ParameterFlags
  fields:
  - name: name
    type: constant?
  - name: name_loc
    type: location?
  - name: operator_loc
    type: location
  comment: |
    Represents a block parameter of a method, block, or lambda definition.

        def a(&b)
              ^^
        end
- name: BlockParametersNode
  prism: BlockParametersNode
  steep: typed
  fields:
  - name: parameters
    type: node?
    kind: ParametersNode
  - name: opening_loc
    type: location?
  - name: closing_loc
    type: location?
  comment: |
    Represents a block's parameters declaration.

        -> (a, b = 1; local) { }
           ^^^^^^^^^^^^^^^^^

        foo do |a, b = 1; local|
               ^^^^^^^^^^^^^^^^^
        end
  steep_notes:
  - parser の procarg0(`|a|` の自動 splat)に対応するノードは無い。requireds が 1 つだけで他が空、かつ rest が ImplicitRestNode でないとき(`|a,|` ではない)に procarg0 相当と判定する。`|(a, b)|` は requireds に MultiTargetNode。
- name: BreakNode
  prism: BreakNode
  steep: typed
  fields:
  - name: arguments
    type: node?
    kind: ArgumentsNode
  - name: keyword_loc
    type: location
  comment: |
    Represents the use of the `break` keyword.

        break foo
        ^^^^^^^^^
- name: CallAndWriteNode
  prism: CallAndWriteNode
  steep: typed
  flags: CallNodeFlags
  fields:
  - name: receiver
    type: node?
    kind: non-void expression
  - name: call_operator_loc
    type: location?
  - name: message_loc
    type: location?
  - name: read_name
    type: constant
  - name: write_name
    type: constant
  - name: operator_loc
    type: location
  - name: value
    type: node
    kind: non-void expression
  comment: |
    Represents the use of the `&&=` operator on a call.

        foo.bar &&= value
        ^^^^^^^^^^^^^^^^^
- name: CallNode
  prism: CallNode
  steep: typed
  flags: CallNodeFlags
  fields:
  - name: receiver
    type: node?
    kind: non-void expression
  - name: call_operator_loc
    type: location?
  - name: name
    type: constant
  - name: message_loc
    type: location?
  - name: opening_loc
    type: location?
  - name: arguments
    type: node?
    kind: ArgumentsNode
  - name: closing_loc
    type: location?
  - name: equal_loc
    type: location?
  - name: block
    type: node?
    kind:
    - BlockNode
    - BlockArgumentNode
  comment: |
    Represents a method call, in all of the various forms that can take.

        foo
        ^^^

        foo()
        ^^^^^

        +foo
        ^^^^

        foo + bar
        ^^^^^^^^^

        foo.bar
        ^^^^^^^

        foo&.bar
        ^^^^^^^^
  steep_notes:
  - parser の send / csend / block / numblock / itblock を 1 クラスで表す。ブロックは block フィールド(BlockNode | BlockArgumentNode)、`&.` は CallNodeFlags::SAFE_NAVIGATION。
  - "`a[1]` は name が `:[]` で opening_loc / closing_loc が括弧、message_loc は `[1]` 全体(parser の selector と同じ)。`a.()` は name が `:call` で message_loc が nil。`!a` / `not a` は name が `:!`。"
  - TypeApplicationNode(`#$ Type`)はこのノードに付く。
  - synthesize_sendish / deconstruct_sendish_and_block_nodes が不要になる。
- name: CallOperatorWriteNode
  prism: CallOperatorWriteNode
  steep: typed
  flags: CallNodeFlags
  fields:
  - name: receiver
    type: node?
    kind: non-void expression
  - name: call_operator_loc
    type: location?
  - name: message_loc
    type: location?
  - name: read_name
    type: constant
  - name: write_name
    type: constant
  - name: binary_operator
    type: constant
  - name: binary_operator_loc
    type: location
  - name: value
    type: node
    kind: non-void expression
  comment: |
    Represents the use of an assignment operator on a call.

        foo.bar += baz
        ^^^^^^^^^^^^^^
- name: CallOrWriteNode
  prism: CallOrWriteNode
  steep: typed
  flags: CallNodeFlags
  fields:
  - name: receiver
    type: node?
    kind: non-void expression
  - name: call_operator_loc
    type: location?
  - name: message_loc
    type: location?
  - name: read_name
    type: constant
  - name: write_name
    type: constant
  - name: operator_loc
    type: location
  - name: value
    type: node
    kind: non-void expression
  comment: |
    Represents the use of the `||=` operator on a call.

        foo.bar ||= value
        ^^^^^^^^^^^^^^^^^
- name: CallTargetNode
  prism: CallTargetNode
  steep: typed
  flags: CallNodeFlags
  fields:
  - name: receiver
    type: node
    kind: non-void expression
  - name: call_operator_loc
    type: location
  - name: name
    type: constant
  - name: message_loc
    type: location
  comment: |
    Represents assigning to a method call.

        foo.bar, = 1
        ^^^^^^^

        begin
        rescue => foo.bar
                  ^^^^^^^
        end

        for foo.bar in baz do end
            ^^^^^^^
  steep_notes:
  - "`a.b, c = x` の左辺(parser は value なしの send :b= だった)。"
- name: CapturePatternNode
  prism: CapturePatternNode
  steep: unsupported
  fields:
  - name: value
    type: node
    kind: pattern expression
  - name: target
    type: node
    kind: LocalVariableTargetNode
  - name: operator_loc
    type: location
  comment: |
    Represents assigning to a local variable in pattern matching.

        foo => [bar => baz]
                ^^^^^^^^^^
- name: CaseMatchNode
  prism: CaseMatchNode
  steep: unsupported
  fields:
  - name: predicate
    type: node?
    kind: non-void expression
  - name: conditions
    type: node[]
    kind: InNode
  - name: else_clause
    type: node?
    kind: ElseNode
  - name: case_keyword_loc
    type: location
  - name: end_keyword_loc
    type: location
  comment: |
    Represents the use of a case statement for pattern matching.

        case true
        in false
        end
        ^^^^^^^^^
- name: CaseNode
  prism: CaseNode
  steep: typed
  fields:
  - name: predicate
    type: node?
    kind: non-void expression
  - name: conditions
    type: node[]
    kind: WhenNode
  - name: else_clause
    type: node?
    kind: ElseNode
  - name: case_keyword_loc
    type: location
  - name: end_keyword_loc
    type: location
  comment: |
    Represents the use of a case statement.

        case true
        when false
        end
        ^^^^^^^^^^
- name: ClassNode
  prism: ClassNode
  steep: typed
  fields:
  - name: class_keyword_loc
    type: location
  - name: constant_path
    type: node
    kind:
    - ConstantReadNode
    - ConstantPathNode
  - name: inheritance_operator_loc
    type: location?
  - name: superclass
    type: node?
    kind: non-void expression
  - name: body
    type: node
    kind:
    - StatementsNode
    - BeginNode
    steep: Prism では nil 可。Steep では空でも常に存在する(アノテーションの付与先)。
  - name: end_keyword_loc
    type: location
  - name: name
    type: constant
  comment: |
    Represents a class declaration involving the `class` keyword.

